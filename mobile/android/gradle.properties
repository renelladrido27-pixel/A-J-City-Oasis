org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
# This dev network has shown flaky mid-download connection resets/hangs
# (both here and with the Android SDK component downloads) — without these,
# a stalled dependency fetch hangs the whole build indefinitely instead of
# failing fast so it can be retried.
systemProp.org.gradle.internal.http.connectionTimeout=30000
systemProp.org.gradle.internal.http.socketTimeout=30000
systemProp.http.keepAlive=false
# Kotlin's incremental-compilation cache (memory-mapped files under build/)
# reproducibly fails to close on this Windows machine — "Could not close
# incremental caches" in url_launcher_android's compileDebugKotlin, most
# likely real-time antivirus scanning holding a transient file lock at the
# exact moment Kotlin tries to flush/close it. Disabling incremental
# compilation avoids that write/close path entirely; costs a little build
# speed, but each affected module still only compiles fully once per class.
kotlin.incremental=false

android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
